name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gps-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas/

      # Each main build replaces the "latest" release, so this link always serves the newest APK
      # as a plain file that downloads without a GitHub sign-in:
      # https://github.com/dannylombardo/GPS_Tracker/releases/latest/download/gps-tracker.apk
      - name: Publish APK to latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gps-tracker.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest gps-tracker.apk \
            --title "GPS Tracker (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On an Android phone, tap gps-tracker.apk below to download it, then open it to install." \
            --target "$GITHUB_SHA" \
            --latest
